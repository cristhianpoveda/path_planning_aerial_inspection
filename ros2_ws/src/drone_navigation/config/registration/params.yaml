/**/registration_node:
  ros__parameters:

    camera_calib: ""

    board_pose: [-0.024300,  0.000000, -0.999705,  5.998163,
                 -0.999705,  0.000000,  0.024300, -1.407646,
                  0.000000,  1.000000,  0.000000,  0.552746,
                  0.000000,  0.000000,  0.000000,  1.000000]

    # Per-frame gates
    min_tags: 15
    max_reproj_px: 3.0
    min_standoff_m: 1.5
    max_standoff_m: 3.0

    # Per-fix gates
    collect_seconds: 5.0
    min_frames: 30
    max_pos_sd_mm: 30.0
    max_rot_sd_deg: 0.5

    # Link gates
    min_baseline_m: 1.5
    scale_min: 0.90
    scale_max: 1.10
    max_fix_disagree_m: 0.10
    max_fix_disagree_deg: 2.0
    require_epoch_stable: true
    
    forbidden_flags: ["S_UNRESCALED", "S_CLAMPED", "VO_GAP"]

    publish_fix: "b"
    output_path: "registration.yaml"
