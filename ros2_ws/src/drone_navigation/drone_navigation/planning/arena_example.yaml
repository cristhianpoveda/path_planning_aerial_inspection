# Arena definition. Frame = OptiTrack (mocap). Metres.

arena:
  min: [1.00, -4.00, 0.00]
  max: [6.00,  0.00, 3.00]

obstacles:
  - name: box1                      # axis-aligned
    centre:  [1.90, -1.30, 0.50]
    extents: [0.80,  0.60, 1.00]

  - name: box2                      # rotated about z
    centre:  [3.20, -2.00, 0.60]
    extents: [0.90,  0.55, 1.20]
    yaw_deg: 30.0

targets:
  - {name: wall_a, centre: [2.60, -4.00, 1.40], normal: [0, 1, 0], w_t: 0.004}
  - {name: wall_b, centre: [4.90, -4.00, 1.20], normal: [0, 1, 0], w_t: 0.004}
  - {name: box2_a, box: box2, face: +x, w_t: 0.003}
  - {name: box2_b, box: box2, face: -y, w_t: 0.003}
  - {name: box1_a, box: box1, face: -y, w_t: 0.003}

# Registration landmark
board:
  centre: [5.990, -1.738, 0.883]
  normal: [-1.000, 0.024, 0.000]
  span:   0.7128
