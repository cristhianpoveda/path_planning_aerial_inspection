name: drone-autonomy

x-ros-env: &ros-env
  ROS_DOMAIN_ID: "12"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  ROS_LOCALHOST_ONLY: "0"

x-build-args: &build-args
  USERNAME: ros
  USER_UID: "${UID:-1000}"
  USER_GID: "${GID:-1000}"

services:
  bridge:
    build:
      context: .
      dockerfile: docker/bridge/bridge.Dockerfile
      args: *build-args
    network_mode: host
    ipc: host
    environment: *ros-env
    volumes:
      - ./ros2_ws:/ros2_ws:rw
      - ./config:/config:ro
    command: ["bash"]
    stdin_open: true
    tty: true

  localisation:
    build:
      context: .
      dockerfile: docker/localisation/localisation.Dockerfile
      args: *build-args
    network_mode: host
    ipc: host
    environment: *ros-env
    volumes:
      - ./ros2_ws:/ros2_ws:rw
      - ./config:/config:ro
      - ./slam_data:/slam_data:rw
    command: ["bash"]
    stdin_open: true
    tty: true

  navigation:
    build:
      context: .
      dockerfile: docker/navigation/navigation.Dockerfile
      args: *build-args
    network_mode: host
    ipc: host
    environment: *ros-env
    volumes:
      - ./ros2_ws:/ros2_ws:rw
      - ./config:/config:ro
    command: ["bash"]
    stdin_open: true
    tty: true

  evaluation:
    build:
      context: .
      dockerfile: docker/evaluation/evaluation.Dockerfile
      args: *build-args
    network_mode: host
    ipc: host
    environment: *ros-env
    volumes:
      - ./ros2_ws:/ros2_ws:rw
      - ./config:/config:ro
      - ./eval_logs:/eval_logs:rw
    command: ["bash"]
    stdin_open: true
    tty: true
