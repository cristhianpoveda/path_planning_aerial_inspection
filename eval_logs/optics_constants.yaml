# Measured optics constants

constants:
  b_0:    1.461      # px, PSF width at best focus
  k_dof:  2.768      # px per unit relative defocus
  d_f:    1.567      # m, focus distance
  k_r:    1.234      # sd 0.231, range 0.94-1.84 over 9 standoffs
  d_min:  1.02       # m, MTF50 within 70% of peak
  d_max:  3.40       # m
  t_exp:  null       # [T] pending speed_1420

fit:
  n_frames: 309
  n_segments: 12
  standoff_range_m: [0.82, 2.27]
  weighted_rms_px: 0.293
  constant_sigma_rms_px: 0.680     # defocus explains 57% of the spread
  peak_mtf50_cy_px: 0.1282

sigma_by_standoff:      # d_m, n_frames, sigma_px, n_edges
  - [0.82, 30, 2.62, 2]
  - [0.83, 27, 2.87, 2]
  - [0.83, 19, 2.88, 2]
  - [0.84, 21, 3.38, 2]
  - [1.21, 28, 1.20, 4]
  - [1.39, 31, 1.80, 4]
  - [1.92, 26, 1.73, 3]
  - [2.01, 27, 1.72, 3]
  - [2.08, 18, 1.50, 2]
  - [2.14, 10, 1.75, 3]
  - [2.14,  7, 1.76, 3]
  - [2.27, 26, 1.37, 2]

finest_resolved_mm:     # group clearing 3x the panel noise floor
  0.82: 1.87
  0.83: 1.87
  0.84: 1.87
  1.21: 1.87
  1.39: 1.87
  1.92: 2.95
  2.01: 2.95
  2.08: 2.95
  2.27: 2.95
  3.11: 3.44          # standoff had no MTF frames; excluded from k_r

w_min_mm:               # at the fitted constants, v = 0
  1.02: 2.21
  1.21: 2.14
  1.57: 2.33
  1.75: 2.56
  2.00: 2.99
  2.50: 4.05
  3.40: 6.24

quality_model:
  peak_depth_m: 1.226
  curvature_at_peak: -1.491
  concave_band_m: [0.673, 1.782]
  effective_band_m: [1.02, 1.782]     # capped at the concavity limit

notes:
  - Focus is fixed, not autofocusing. Within-segment lag-1 autocorrelation
    near zero and drift small in 10 of 12 segments.
  - Focus is not set for the panel and cannot be. Autofocus would move f_x
    and invalidate the VO calibration, so d_f = 1.567 m is the value the
    localisation requires, not one chosen for measurement. b_0 = 1.461 px is
    5.1x the sensor pixel aperture of 0.289 px. The measurement floor is set
    by a localisation constraint.
  - Finest resolvable feature is 2.14 mm at the peak. The platform measures
    2-3 mm features; nothing finer is resolvable anywhere in the band.
  - The earlier k_r = 0.46 came from a percentile contrast metric that
    reported 0.75 mm resolved at 2.27 m, where a line pair spans 0.95 px.
    Replaced with modulation at each group's own fundamental, with groups
    under 3 px period rejected.
  - MTF50 recovery validated against synthetic Gaussian edges: within 2% at
    1.8 px, 5% at 3.0 px, high by 15-40% below 1 px.
  - n_edges is 2 of 4 at several standoffs; the other two edges fell outside
    the frame or the second panel was not in view.
  - Segment at 3.11 m yielded contrast but no MTF frames.
  - dof_sweep_1349 has 65 camera stalls (1.3% of bag); none overlap the
    hover segments used.
